# Music deck: your Music Assistant library on the glass. Playlists (or albums, artists, radio) as a list with filters
# you pick, the speakers you pick beside each other, what plays now with play, pause and skip, and a tap on a row that
# plays it. The library comes from Music Assistant's own action, music_assistant.get_library, asked through the app;
# Music Assistant holds every account (YouTube Music, Spotify, ...), the screen never sees a login.
# docs/MANIFEST.md in the plugins repository has every field.
id: music_deck
version: 0.1.3
# 0.12 a card's taps and actions with a JSON object, 0.14 wish(), 0.15 the extra speakers as entity options, 0.17 the
# cover of what plays by name (cover:<entity>).
api: "0.17"
icon: playlist-music
maintainer: Bruiserbaum
license: MIT
stage: beta
topics: [media]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 16

permissions:
  # A row plays on the chosen speaker; the keys play, pause and skip. Play and pause go through wish(), which sends
  # Home Assistant's own action for them.
  home_assistant_actions: [music_assistant.play_media, media_player.media_play_pause, media_player.media_next_track,
                           media_player.media_previous_track]
  # A page of the library, asked of Music Assistant through the app.
  ha_commands: ["call_service:music_assistant.get_library"]

inputs:
  # Which Music Assistant to ask: the id of its entry in Home Assistant, the same for every screen.
  - { id: entry, kind: text, scope: all, label: input_entry, hint: input_entry_hint }

tiles:
  - id: deck
    name: tile_name
    icon: playlist-music
    sizes: { min: 1x1, max: 6x6 }
    # The full deck on its largest size: a row of what plays (a cover, two lines, three keys), up to four speaker chips
    # and six filter chips with their words, two page keys, twelve rows, a note; about 50 LVGL objects, and the
    # speakers and the page of the library in fixed fields.
    memory: 6500
    # The cover of what the tile's own player plays.
    pictures: 1
    # The tile's own player: a Music Assistant player (only those carry `mass_player_type`).
    domains: [media_player]
    attributes: [media_title, media_artist]
    example: tile_example
    preview: { title: "{media_title}", badge: "{state}" }
    options:
      - { id: kind, kind: choice, label: kind, hint: kind_hint, default: playlist,
          choices: [{ value: playlist, label: kind_playlist }, { value: album, label: kind_album },
                    { value: artist, label: kind_artist }, { value: radio, label: kind_radio },
                    { value: podcast, label: kind_podcast }, { value: audiobook, label: kind_audiobook }] }
      - { id: filters, kind: choice, multiple: 6, label: filters, hint: filters_hint,
          choices: [{ value: all, label: filter_all }, { value: favorites, label: filter_favorites },
                    { value: recent, label: filter_recent }, { value: most, label: filter_most },
                    { value: added, label: filter_added }, { value: random, label: filter_random }] }
      - { id: contains, kind: text, label: contains, hint: contains_hint }
      - { id: speaker_2, kind: entity, domains: [media_player], attributes: [media_title, media_artist],
          label: speaker_2, hint: speakers_hint }
      - { id: speaker_3, kind: entity, domains: [media_player], attributes: [media_title, media_artist],
          label: speaker_3, hint: speakers_hint }
      - { id: speaker_4, kind: entity, domains: [media_player], attributes: [media_title, media_artist],
          label: speaker_4, hint: speakers_hint }
      - { id: enqueue, kind: choice, label: enqueue, hint: enqueue_hint, default: replace,
          choices: [{ value: replace, label: enqueue_replace }, { value: play, label: enqueue_play },
                    { value: next, label: enqueue_next }, { value: add, label: enqueue_add }] }

cards:
  # The whole deck over the page, opened by a tap on a tile too small to hold it.
  - { id: deck, name: card_name, wide: true, pictures: 1 }
