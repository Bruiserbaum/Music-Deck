# What tools/preview.py shows (docs/PREVIEW.md): a Music Assistant player that plays, a second speaker, and a page of
# playlists as music_assistant.get_library answers it. Never put a secret here.
tiles:
  - tile: deck
    name: Music
    entity: media_player.living_room
    options: { speaker_2: media_player.kitchen, speaker_3: media_player.garage, filters: [all, favorites, recent, most] }
  - tile: deck
    name: Kitchen
    entity: media_player.kitchen
    sizes: [1x1, 2x1]

states:
  media_player.living_room:
    state: playing
    attributes:
      friendly_name: Living room
      mass_player_type: player
      media_title: Chop Suey!
      media_artist: System Of A Down
      media_duration: 210
      media_position: 74
      volume_level: 0.45
      is_volume_muted: false
      group_members: [media_player.living_room, media_player.kitchen]
  media_player.kitchen:
    state: playing
    attributes:
      friendly_name: Kitchen
      mass_player_type: player
      media_title: Chop Suey!
      media_artist: System Of A Down
      volume_level: 0.3
      group_members: [media_player.living_room, media_player.kitchen]
  media_player.garage:
    state: idle
    attributes:
      friendly_name: Garage speaker
      mass_player_type: player
      volume_level: 0.6

cards:
  - { card: deck, entity: media_player.living_room }

commands:
  "call_service:music_assistant.get_library":
    limit: 12
    offset: 0
    order_by: sort_name
    media_type: playlist
    items:
      - { media_type: playlist, uri: "library://playlist/60", name: "'00s Metal", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/4", name: "500 Random tracks (from library)", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/52", name: "90s-00s Hits", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/50", name: "Aggro Anthems", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/1", name: "All favorited tracks", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/71", name: "Chill Evening", version: "", favorite: true }
      - { media_type: playlist, uri: "library://playlist/72", name: "Coffee Shop Acoustic", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/73", name: "Deep Focus", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/74", name: "Friday Night Rock", version: "", favorite: true }
      - { media_type: playlist, uri: "library://playlist/75", name: "Grunge Essentials", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/76", name: "Road Trip", version: "", favorite: false }
      - { media_type: playlist, uri: "library://playlist/77", name: "Workout Mix", version: "", favorite: false }
